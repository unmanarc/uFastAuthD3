<script>
    // Tracks whether the account field modal is being used to create or to edit a field.
    let accountFieldModalMode = 'create';

    function updateFieldTypeIcon() {
        var fieldType = document.getElementById("fieldType").value;
        var icon = document.getElementById("fieldTypeIcon");
        icon.className = 'fa-solid';
        switch (fieldType) {
            case 'TEXTLINE':
                icon.classList.add('fa-font');
                break;
            case 'TEXTAREA':
                icon.classList.add('fa-align-left');
                break;
            case 'PASSWORD':
                icon.classList.add('fa-key');
                break;
            case 'EMAIL':
                icon.classList.add('fa-envelope');
                break;
            case 'NUMBER':
                icon.classList.add('fa-hashtag');
                break;
            case 'CHECKBOX':
                icon.classList.add('fa-square-check');
                break;
            default:
                icon.classList.add('fa-circle-info');
                break;
        }
    }

    function updateIsUniqueState() {
        const isLoginIdentifier = document.getElementById("isLoginIdentifier");
        const isUnique = document.getElementById("isUnique");

        if (isLoginIdentifier.checked) {
            isUnique.checked = true;
            isUnique.disabled = true;
            isUnique.readOnly = true;
        } else {
            isUnique.disabled = false;
            isUnique.readOnly = false;
        }
    }

    function createAccountFieldClearParameters() {
        // Reset modal mode to "create"
        accountFieldModalMode = 'create';

        // Reset text inputs
        document.getElementById("fieldName").value = "";
        document.getElementById("fieldName").readOnly = false;
        document.getElementById("fieldName").style.backgroundColor = "#FFFFFF";

        document.getElementById("fieldDescription").value = "";
        document.getElementById("fieldRegexpValidator").value = "";
        // Reset select dropdown
        document.getElementById("fieldType").selectedIndex = 0;
        updateFieldTypeIcon();

        // Reset checkbox states to their original defaults
        /*      
        document.getElementById("isOptionalField").checked = true;
        document.getElementById("isOptionalField").disabled = false;
        document.getElementById("isOptionalField").readOnly = false;

        document.getElementById("includeInSearch").checked = false;
        document.getElementById("includeInColumnView").checked = false;
        */

        document.getElementById("includeInToken").checked = true;
        document.getElementById("includeInAPISync").checked = true;

        document.getElementById("isUnique").checked = false;
        document.getElementById("isUnique").disabled = false;
        document.getElementById("isUnique").readOnly = false;

        document.getElementById("isLoginIdentifier").checked = false;
        document.getElementById("isLoginIdentifier").disabled = false;
        document.getElementById("isLoginIdentifier").readOnly = false;

        document.getElementById("canUserEdit").checked = false;
        document.getElementById("canUserEdit").disabled = false;
        document.getElementById("canUserEdit").readOnly = false;

        document.getElementById("canUserView").checked = true;
        document.getElementById("canUserView").disabled = false;
        document.getElementById("canUserView").readOnly = false;

        // Change modal title to "Create Accounts Field"
        document.getElementById("modalCreateAccountFieldLabel").innerText = "Create Accounts Field";

        // Change button text to "Create Field"
        const createButton = document.getElementById("modalCreateAccountFieldSubmit");
        if (createButton) {
            createButton.innerText = "Create Field";
        }
    }

    function editAccoundField(fieldNameB64) {
        const fieldName = window.atob(fieldNameB64);

        $.ajax({
            url: '/api/v1/getAccountDetailField',
            type: 'GET',
            contentType: 'application/json',
            data: JSON.stringify({
                fieldName: fieldName
            }),
            error: commonFunctionError,
            success: function (response, textStatus, xhr) {
                // Switch the modal to "edit" mode BEFORE showing it, so the submit button
                // is already bound to the update action when the user clicks it.
                accountFieldModalMode = 'edit';

                // Use the jQuery plugin (same instance the data-bs-toggle create button uses)
                // so a single Bootstrap modal instance manages both the create and edit paths.
                $('#modalCreateAccountField').modal('show');

                // Populate form fields with response data
                document.getElementById("fieldName").value = fieldName;
                document.getElementById("fieldName").readOnly = true;
                document.getElementById("fieldName").style.backgroundColor = "#f8f9fa";
                document.getElementById("fieldDescription").value = response.description || "";
                document.getElementById("fieldRegexpValidator").value = response.extendedAttributes.behavior.regexpValidator || "";

                // Set select dropdown value
                const fieldTypeSelect = document.getElementById("fieldType");
                if (response.fieldType) {
                    for (let i = 0; i < fieldTypeSelect.options.length; i++) {
                        if (fieldTypeSelect.options[i].value === response.fieldType) {
                            fieldTypeSelect.selectedIndex = i;
                            break;
                        }
                    }
                }
                updateFieldTypeIcon();

                // Set checkbox states
                document.getElementById("includeInToken").checked = response.extendedAttributes.visibility.includeInToken ?? false;
                document.getElementById("includeInAPISync").checked = response.extendedAttributes.visibility.includeInAPISync ?? false;
                document.getElementById("canUserEdit").checked = response.extendedAttributes.security.canUserEdit ?? false;
                document.getElementById("canUserView").checked = response.extendedAttributes.security.canUserView ?? false;
                document.getElementById("isUnique").checked = response.isUnique ?? false;
                document.getElementById("isLoginIdentifier").checked = response.isLoginIdentifier ?? false;

                // Apply isUnique state based on isLoginIdentifier
                updateIsUniqueState();

                // Change modal title to "Edit Accounts Field"
                document.getElementById("modalCreateAccountFieldLabel").innerText = "Edit Accounts Field";

                // Change button text to "Update Field"
                const updateButton = document.getElementById("modalCreateAccountFieldSubmit");
                if (updateButton) {
                    updateButton.innerText = "Update Field";
                }
            }
        });
    }

    // Submit handler for the account field modal. Dispatches to the create or update
    // action based on accountFieldModalMode. In edit mode a confirmation dialog is
    // shown first, since changing field settings may make stored data incompatible.
    function modalCreateAccountFieldSubmit() {
        if (accountFieldModalMode === 'edit') {
            showYesNoHTMLDialog("<b>WARNING:</b> Updating this field will not verify the data already stored in the database against the new parameters. Existing data may become invalid or incompatible with the updated field settings.<br><br>Do you still want to update?",
            function (result) {
                if (result) {
                    ajaxCreateAccountField(true);
                }
            });
        } else {
            ajaxCreateAccountField(false);
        }
    }

    function ajaxCreateAccountField(isUpdate = false) {
        const fieldName = $("#fieldName").val();

        // Validate field name to ensure it only contains letters, numbers, hyphens, or underscores
        const fieldNameRegex = /^[A-Za-z0-9_-]+$/;
        if (!fieldNameRegex.test(fieldName)) {
            showTextToastError("Field name must contain only letters, numbers, hyphens, or underscores.");
            return;
        }

        // Determine the URL based on whether it's an update or create operation
        const url = isUpdate
            ? '/api/v1/updateAccountDetailField'
            : '/api/v1/createAccountDetailField';

        // Determine the HTTP method
        const method = isUpdate ? 'PUT' : 'POST';

        $.ajax({
            url: url,
            type: method,
            contentType: 'application/json',
            data: JSON.stringify({
                fieldName: fieldName,
                description: $("#fieldDescription").val(),
                fieldType: $("#fieldType").val(),
                isUnique: $("#isUnique:checked").length > 0,
                isLoginIdentifier: $("#isLoginIdentifier:checked").length > 0,
                isOptionalField: $("#isOptionalField:checked").length > 0,
                extendedAttributes: {
                    visibility: {
                        includeInToken: $("#includeInToken:checked").length > 0,
                        includeInAPISync: $("#includeInAPISync:checked").length > 0
                        /*
                        includeInSearch: $("#includeInSearch:checked").length > 0,
                        includeInColumnView: $("#includeInColumnView:checked").length > 0,
                        */
                    },
                    behavior: {
                        regexpValidator: $("#fieldRegexpValidator").val()
                    },
                    security: {
                        canUserEdit: $("#canUserEdit:checked").length > 0,
                        canUserView: $("#canUserView:checked").length > 0
                    }
                }
            }),
            success: function (response, textStatus, xhr) {
                // Refresh the fields table right after a successful create/update
                $('#fieldsTable').DataTable().ajax.reload(null, false);

                // Show appropriate success message
                showTextToastSuccess(isUpdate
                    ? "Field updated successfully."
                    : "Field created successfully.");

                // Close the modal (it may still be open, e.g. when the confirmation
                // dialog was dismissed and reopened).
                $('#modalCreateAccountField').modal('hide');
            },
            error: commonFunctionError
        });
    }

    // Safety-net handler for the account field modal:
    // - Removes any orphaned backdrop left behind (which would block the whole page),
    // - Resets the modal mode flag so the next open always starts clean,
    // - Reloads the fields table so create/update/delete are always reflected.
    $('#modalCreateAccountField').on('hidden.bs.modal', function () {
        $('.modal-backdrop').removeClass('show').remove();
        accountFieldModalMode = 'create';
        try {
            $('#fieldsTable').DataTable().ajax.reload(null, false);
        } catch (e) {
            // Table may not be initialized yet; ignore.
        }
    });
</script>

<div class="modal fade" id="modalCreateAccountField" data-bs-backdrop="static" data-bs-keyboard="true" tabindex="-1"
    aria-labelledby="modalCreateAccountFieldLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalCreateAccountFieldLabel">Create New Account Field</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <table width=100% style=" border-spacing: 10px;   border-collapse: separate;">
                    <tr>
                        <td colspan="2" align="">
                            <h6>Accounts Field Info</h6>
                            <hr>
                        </td>
                    </tr>

                    <tr>
                        <td align="right">Field Key Name:</td>
                        <td><input type="text" name="fieldName" id="fieldName" class="form-control"
                                placeholder="Field Key Name (letters, numbers, hyphens, underscores only)" required
                                oninput="this.value = this.value.toUpperCase().replace(/[^A-Z0-9_-]/g, '')">
                        </td>
                    </tr>

                    <tr>
                        <td align="right">Field Description:</td>
                        <td><textarea name="fieldDescription" id="fieldDescription" class="form-control"
                                placeholder="Field Description" rows="3" required></textarea></td>
                    </tr>
                    <tr>
                        <td align="right">Regular Expression Validator:</td>
                        <td><input type="text" name="fieldRegexpValidator" id="fieldRegexpValidator"
                                class="form-control" placeholder="Regular Expression Validator (Optional)"></td>
                    </tr>
                    <tr>
                        <td align="right">Field Type:</td>
                        <td>
                            <div class="d-flex align-items-center gap-2">
                                <i id="fieldTypeIcon" class="fa-solid fa-font"></i>
                                <select name="fieldType" id="fieldType" class="form-control" onchange="updateFieldTypeIcon()">
                                    <option value="TEXTLINE">Text Line</option>
                                    <option value="TEXTAREA">Text Area</option>
                                    <option value="PASSWORD">Secret</option>
                                    <option value="EMAIL">Email</option>
                                    <option value="NUMBER">Number</option>
                                    <option value="CHECKBOX">Checkbox (Boolean)</option>
                                </select>
                            </div>
                        </td>
                    </tr>

                    <tr>
                        <td colspan="2" align="">
                            <h6>Field Options</h6>
                            <hr>
                        </td>
                    </tr>
                    <!--         <tr>
                        <td align="right">Is Optional Field:</td>
                        <td><input type="checkbox" id="isOptionalField" checked></td>
                    </tr>
                    <tr>
                        <td align="right">Include in Search:</td>
                        <td><input type="checkbox" id="includeInSearch"></td>
                    </tr>

                    <tr>
                        <td align="right">Include in Column View:</td>
                        <td><input type="checkbox" id="includeInColumnView"></td>
                    </tr>-->

                    <tr>
                        <td align="right">Include in Token:</td>
                        <td><input type="checkbox" id="includeInToken"></td>
                    </tr>

                    <tr>
                        <td align="right">Include in API Synchronization:</td>
                        <td><input type="checkbox" id="includeInAPISync"></td>
                    </tr>

                    <tr>
                        <td align="right">Is Unique:</td>
                        <td><input type="checkbox" id="isUnique"></td>
                    </tr>
                    <tr>
                        <td align="right">Can Login with this Field:</td>
                        <td><input type="checkbox" id="isLoginIdentifier" onchange="updateIsUniqueState()"></td>
                    </tr>
                    <tr>
                        <td align="right">User can edit this field:</td>
                        <td><input type="checkbox" id="canUserEdit"></td>
                    </tr>
                    <tr>
                        <td align="right">User can view this field:</td>
                        <td><input type="checkbox" id="canUserView"></td>
                    </tr>

                </table>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button type="button" id="modalCreateAccountFieldSubmit" class="btn bfsuccess btn-primary" onclick="modalCreateAccountFieldSubmit()">Create
                    Field</button>
            </div>
        </div>
    </div>
</div>
